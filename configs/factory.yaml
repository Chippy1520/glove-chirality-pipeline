# Portable factory inspection template.
# Replace yolo_model with the local single-class YOLO11n-seg checkpoint.
# Do not commit that weight file. Select it from the Layer 1 page if this
# relative placeholder is not the checkpoint on this machine.
detector:
  backend: yolo
  roi: [0.12, 0.03, 0.98, 0.995]
  trigger_zone: [0.15, 0.10, 0.97, 0.96]
  require_full_containment: true
  trigger_inner_margin_ratio: 0.0
  yolo_model: checkpoints/yolo11n-seg.pt
  yolo_confidence: 0.15
  yolo_class_id: 0
  yolo_device: auto
  yolo_half: false
  yolo_use_masks: true
  yolo_require_masks: true
  yolo_crop_to_roi: true
  yolo_imgsz: 640
  yolo_iou: 0.50
  yolo_max_det: 5
  yolo_min_box_area_ratio: 0.03
  yolo_max_box_area_ratio: 0.40
event:
  reject_multiple_detections: true
  crop_padding: 0.0
  make_square: false
  crop_mode: bbox
  output_size: 256
  letterbox_fill: 114
  timing_mode: time
  min_detected_seconds: 0.08
  exit_missing_seconds: 0.20
  cooldown_seconds: 0.30
  association_iou_weight: 0.25
  trigger_line_enabled: true
  belt_direction: bottom_to_top
  trigger_line_fraction: 0.5
  tracker_mode: passage_v2
  crop_selector: best_frame
  low_conf_recovery: true
  track_low_conf: 0.15
  track_high_conf: 0.35
  new_track_conf: 0.45
  reentry_time_s: 0.50
  trigger_hysteresis_ratio: 0.02
  max_track_distance_ratio: 0.12
runtime:
  capture_queue_size: 2
  detect_every_n_frames: 1
  report_interval_seconds: 5.0
  warmup: true
